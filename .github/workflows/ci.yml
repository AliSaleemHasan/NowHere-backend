name: CI

on:
  push:
    branches: [master, main, fixes]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"
      - run: pnpm exec jest --ci --forceExit
      - run: pnpm nx run-many --target=build --all
