apiVersion: apps/v1
kind: Deployment
metadata:
  name: nowhere-gateway
  labels:
    app: nowhere-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nowhere-gateway
  template:
    metadata:
      labels:
        app: nowhere-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gateway
          image: nowhere/gateway:latest
          ports:
            - containerPort: 3005
              name: http
          envFrom:
            - secretRef:
                name: nowhere-gateway-secrets
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nowhere-gateway
spec:
  type: LoadBalancer
  selector:
    app: nowhere-gateway
  ports:
    - name: http
      port: 3005
      targetPort: 3005
---
