services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - ${MONGO_PORT:-27017}:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-root}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-snaps}
    volumes:
      - mongo-data:/data/db

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ':9001'
    container_name: minio-local
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minio_admin_user
      MINIO_ROOT_PASSWORD: minio_secure_dev_pass_2026!
    volumes:
      - minio-data:/data

  mysql:
    image: mysql:9.4.0
    restart: unless-stopped
    ports:
      - 3307:3306
    volumes:
      - ./mysql_init:/docker-entrypoint-initdb.d
      - sql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root

  nats:
    image: nats:2.11-alpine
    command:
      - '--jetstream'
      - '--store_dir=/data'
      - '--auth=${NATS_TOKEN:-dev_nats_token}'
    ports:
      - '4222:4222'
      - '8222:8222'
    volumes:
      - nats_data:/data

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-dev_redis_password}']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  nowhere-snaps:
    container_name: nowhere-snaps-dev
    env_file:
      - ./apps/snaps/.env
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        APP_NAME: snaps
        APP_PORT: '3000'
      target: dev
    environment:
      NODE_ENV: development
      ENABLE_SEED: ${ENABLE_SEED:-false}
      NATS_URL: nats://${NATS_TOKEN:-dev_nats_token}@nats:4222
    volumes:
      - ./apps/snaps:/usr/src/apps/snaps
      - ./libs:/usr/src/libs
      - ./uploads:/usr/src/apps/uploads
      - /usr/src/node_modules
    depends_on:
      - mongodb
      - nats
    ports:
      - '3000:3000'
    command: pnpm nx start snaps

  nowhere-users:
    container_name: nowhere-users-dev
    env_file:
      - ./apps/users/.env
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        APP_NAME: users
        APP_PORT: '3001'
      target: dev
    environment:
      NODE_ENV: development
      TYPEORM_SYNC: 'true'
      NATS_URL: nats://${NATS_TOKEN:-dev_nats_token}@nats:4222
    volumes:
      - ./apps/users:/usr/src/apps/users
      - ./libs:/usr/src/libs
      - /usr/src/node_modules
    command: pnpm nx start users
    ports:
      - '3001:3001'
    depends_on:
      - mysql
      - nats

  authentication:
    container_name: nowhere-authentication-dev
    env_file:
      - ./apps/authentication/.env
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        APP_NAME: authentication
        APP_PORT: '3004'
      target: dev
    environment:
      NODE_ENV: development
      PORT: 3004
      TYPEORM_SYNC: 'true'
      NATS_URL: nats://${NATS_TOKEN:-dev_nats_token}@nats:4222
    volumes:
      - ./apps/authentication:/usr/src/apps/authentication
      - ./libs:/usr/src/libs
      - /usr/src/node_modules
    command: pnpm nx start authentication
    ports:
      - '3004:3004'
    depends_on:
      - mysql
      - nats

  nowhere-storage:
    container_name: nowhere-storage-dev
    env_file:
      - ./apps/storage/.env
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        APP_NAME: storage
        APP_PORT: '3002'
      target: dev
    environment:
      NODE_ENV: development
      NATS_URL: nats://${NATS_TOKEN:-dev_nats_token}@nats:4222
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379
      AWS_PUBLIC_ENDPOINT_URL: ${AWS_PUBLIC_ENDPOINT_URL:-http://192.168.1.69:9000}
    volumes:
      - ./apps/storage:/usr/src/apps/storage
      - ./libs:/usr/src/libs
      - /usr/src/node_modules
    command: pnpm nx start storage
    ports:
      - '3002:3002'
    depends_on:
      - minio
      - nats
      - redis

  nowhere-gateway:
    container_name: nowhere-gateway-dev
    env_file:
      - ./apps/gateway/.env
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        APP_NAME: gateway
        APP_PORT: '3005'
      target: dev
    environment:
      NODE_ENV: development
      PORT: 3005
      NATS_URL: nats://${NATS_TOKEN:-dev_nats_token}@nats:4222
    volumes:
      - ./apps/gateway:/usr/src/apps/gateway
      - ./libs:/usr/src/libs
      - /usr/src/node_modules
    command: pnpm nx start gateway
    ports:
      - '3005:3005'
    depends_on:
      - nats

volumes:
  redis_data:
  mongo-data:
  minio-data:
  sql_data:
  nats_data:
